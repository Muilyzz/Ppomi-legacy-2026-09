# 아이패드 앱 = 뷰어(타임라인·증빙·분개). xcodegen generate → xcodebuild. 대화(통화)는 뒤에: 번들 agent 앱(Web/Agent)과 다리(PadBridge)는 그때 쓴다.
# 장부 = Supabase 의 암호화 기록을 이 기기가 직접 읽어 Mac 과 같은 페이지(Web/timeline.html)로 그린다. 장부 코드는 Mac 타깃의 파일을 그대로 컴파일한다.
name: PpomiPad
options:
  deploymentTarget: {iOS: "17.0"}
targets:
  PpomiPad:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Web
        buildPhase: resources
      - path: ../Ppomi/Sources/Ppomi/Web/Agent
        type: folder
        buildPhase: resources
      - path: ../Ppomi/Sources/Ppomi/AccountingData
        type: folder
        buildPhase: resources
      - path: ../Ppomi/Sources/Ppomi/Web/timeline.html
        buildPhase: resources
      - path: ../Ppomi/Sources/Ppomi/Web/tokens.css
        buildPhase: resources
      - path: ../Ppomi/Sources/Ppomi/Web/theme.css
        buildPhase: resources
      - path: ../Ppomi/Sources/Ppomi/Web/journal.js
        buildPhase: resources
      - ../Ppomi/Sources/Ppomi/Ledger/Model.swift
      - ../Ppomi/Sources/Ppomi/Ledger/Ledger.swift
      - ../Ppomi/Sources/Ppomi/Ledger/Rules.swift
      - ../Ppomi/Sources/Ppomi/Ledger/LedgerPage.swift
      - ../Ppomi/Sources/Ppomi/Accounting/LegacyAccountingRules.swift
      - ../Ppomi/Sources/Ppomi/Accounting/AccountingModel.swift
      - ../Ppomi/Sources/Ppomi/Records/RecordScope.swift
      - ../Ppomi/Sources/Ppomi/Records/LifeJSON.swift
      - ../Ppomi/Sources/Ppomi/Shared/SharedRecordCrypto.swift
      - ../Ppomi/Sources/Ppomi/Shared/SupabaseAuth.swift
      - ../Ppomi/Sources/Ppomi/Shared/SharedLedgerArchive.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muilyzz.ppomi.pad
        DEVELOPMENT_TEAM: AWLTDZ872S
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 뽀미
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: 통화(음성 대화)에 씁니다.
