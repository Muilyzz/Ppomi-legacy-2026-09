<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><title>타임라인</title>
<style>/*THEME*/
svg{display:block;width:100%} #eq{height:10rem}
.charts{position:relative;margin:.5rem 0 .25rem;border:1px solid var(--line)}   /* 판 전체에 테두리 하나 더: 네모끼리 붙은 곳과 바깥이 다 두 줄 */
.tile{position:absolute;box-sizing:border-box;margin:0;padding:0;border:1px solid var(--line);background:var(--surface);overflow:visible} .tile.on{border-color:var(--fg)}
.hoverlay{position:absolute;inset:0;pointer-events:none;z-index:3}
.hval,.hdate{position:absolute;white-space:nowrap;font-size:var(--fs-1);font-variant-numeric:tabular-nums;text-shadow:0 0 2px var(--surface),0 0 2px var(--surface),0 0 4px var(--surface)}   /* 배경 없이 보색(바탕색) 그림자로만 가독성 */
.hval{color:var(--fg);transform:translate(4px,-50%)} .hval.flip{transform:translate(calc(-100% - 4px),-50%)}   /* 금액 글자의 가운데 선이 그 값의 높이 */
.hdate{color:var(--fg-2);transform:translate(-50%,3px)}
.tile figcaption{position:absolute;left:.5rem;right:.5rem;top:.35rem;z-index:1;display:flex;justify-content:space-between;gap:.5rem;font-size:var(--fs-2);white-space:nowrap}   /* 제목은 고정 크기 오버레이; 작은 칸에선 삐져나와도 그대로 */
.tile svg{cursor:pointer;display:block}
.tile figcaption.bare .n,.tile figcaption.bare .meta{display:none}   /* 한 줄에 안 들어가면 이름만(… 없이); 올리면 다 보임 */
.tile.zoom{z-index:2;border-color:var(--fg-2);box-shadow:0 2px 12px color-mix(in srgb,var(--fg) 20%,transparent)} .tile figcaption{cursor:pointer}
.grid{stroke:var(--line)} .axis{fill:var(--fg-2);font-size:var(--fs-1)} .zero{stroke:var(--line-2)}
.area{fill:color-mix(in srgb,var(--fg) 22%,transparent);stroke:none}   /* 면적 그래프: 선 굵기가 없으니 칸이 작아져도 모양이 같다 */ .pin,.sel{fill:var(--accent-soft)} .hover{stroke:var(--line-2)}
.obs{fill:var(--fg)} .exp{fill:var(--fg-2)} .res{fill:none;stroke:var(--fg);stroke-width:1} .dayhit{fill:transparent}
.sec .r{min-width:0;overflow:hidden;padding:4px;margin:-4px} .sec .r>span{overflow:hidden;text-overflow:ellipsis}   /* 긴 '어디로' 목록은 … 로 (가로 스크롤 없음) */
.timeline-section+.timeline-section{margin-top:2rem}
.transaction{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:inherit;cursor:pointer}
body{max-width:none}   /* 맵은 제어 열 전부를 쓴다 */
:root{--k-asset:#2f6fed;--k-expense:#e8792b;--k-liability:#d33a3a;--k-equity:#1f9d6a;--k-income:#0e9aa7}   /* 자산·비용·부채·자본·수익 대표색; 자식은 같은 색의 음영 */
.eqmap{position:relative;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.eqtile{position:absolute;box-sizing:border-box;border:1px solid var(--surface);overflow:visible;cursor:pointer;color:var(--fg)}
.eqtile.leaf{cursor:default}
.eqtile.up>span{top:auto;bottom:.25rem}   /* 맨 아래 얇은 띠: 글자가 맵 밖으로 잘리지 않게 위로 삐져나온다 */
.eqtile>span{position:absolute;left:.4rem;top:.25rem;font-size:var(--fs-2);white-space:nowrap;text-shadow:0 0 2px var(--surface),0 0 2px var(--surface),0 0 4px var(--surface);pointer-events:none}
.eqtile>span .n{display:block;font-variant-numeric:tabular-nums} .eqtile>span .meta{display:block}
#crumbs button.on{font-weight:500} #mapToggle.on{color:var(--fg);font-weight:500}
.eqlist table{margin:.25rem 0} .eqlist.halves{display:grid;grid-template-columns:1fr 1fr;gap:0 1.5rem;align-items:start}
.eqlist tr td:first-child{padding-left:calc(.5rem + var(--d,0)*1.25rem)} .eqlist .tw{display:inline-block;width:1rem;color:var(--fg-2)} .eqlist tr.kid td{cursor:pointer}   /* 종류는 줄 배경의 옅은 음영으로, 작은 네모 없음 */ .eqlist tr.kid{cursor:pointer} .eqlist tbody+tbody tr:first-child td{padding-top:.75rem}
.board{--u:1.5rem;position:relative;margin:.75rem 0;user-select:none;-webkit-user-select:none;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);
  background-image:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px);background-size:var(--u) var(--u)}
.node{position:absolute;box-sizing:border-box}
.grp{width:calc(var(--u)*14);border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);padding:.5rem;display:flex;flex-direction:column;gap:.375rem}
.grp.on{border-color:var(--fg)} .grp.over{background:var(--accent-soft)}
.home{border:1px solid var(--line-2);border-radius:var(--r);padding:.5rem;background:transparent} .home.on{border-color:var(--fg)} .home>header{display:flex;justify-content:space-between;gap:.5rem;font-weight:500;cursor:pointer;user-select:none;-webkit-user-select:none}
.ents{border-left:1px dashed var(--line-2);padding:.5rem;background:transparent} .ents>header{color:var(--fg-2)} .grp.ent{border-color:var(--fg-2)}
.grp>header{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-weight:500;user-select:none;-webkit-user-select:none}
.grp>header .n{font-variant-numeric:tabular-nums}
.acct{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:.375rem .5rem;display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;font-size:var(--fs-2);user-select:none;-webkit-user-select:none}
.acct.free{width:calc(var(--u)*12)} .acct .who{min-width:0} .acct .who div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.native .acct,.native .grp>header{cursor:grab} .dragging{opacity:.9;z-index:2;pointer-events:none}
.board .hint{position:absolute;right:.5rem;bottom:.25rem}
.transaction:focus-visible,.nav button:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<main aria-label="재무 상태">
  <section class="timeline-section" id="eqmap" aria-labelledby="eqmap-title">
    <header class="sec"><h2 id="eqmap-title">재무 상태</h2><div class="r"><nav class="nav" id="crumbs" aria-label="경로"></nav><nav class="nav"><button type="button" id="mapToggle" aria-pressed="true">트리맵</button></nav></div></header>
    <div id="map" class="eqmap" aria-label="차변·대변 트리맵"></div>
    <div id="list" class="eqlist" hidden></div>
    <p class="meta" id="eqline"></p>
  </section>
</main>
<script>
// The data: Swift (Timeline.html) replaces the placeholder with {accounts, series, inside, lines} — the shape report.py's
// timeline_data made, plus uid on each line so a row can open its 증빙. Times are KST wall-clock strings.
var D=/*TIMELINE*/null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c];});}
function post(m){if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.ppomi)webkit.messageHandlers.ppomi.postMessage(m);}
var P=function(s){return new Date(s.replace(' ','T'));},DAY=86400000;
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d;}
function addDays(d,n){return new Date(d.getTime()+n*DAY);}
function won(n){return (n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('ko-KR')+'원';}
function signed(n){return (n>0?'+':'')+won(n);}
function fmt(d){return (d.getMonth()+1)+'/'+d.getDate();}
function fmtFull(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function valueAt(id,t){var a=D.series[id]||[],v=null;for(var i=0;i<a.length;i++){if(P(a[i][0])<=t)v=a[i];else break;}return v;}
var LENS=null,NATIVE=!!(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.ppomi);
// 두 층: 사업자(사실 — 기업뱅킹 앱에서 사업자로 로그인해 읽은 계좌, D.business; 사람이 끌어 정하지 않는다)와 가계부(늘 있는 바닥 = 사업자 계좌가 아닌 전부).
// 렌즈(용도 그룹)는 가계부 안에서만. 법인은 여기 없다: 법인은 사람의 장부가 아니라 제 작업공간(구성원 로그인)이다.
var HOME='가계부',BIZ='사업자';
function entityLenses(){return (D.business||[]).length?[{name:BIZ,inside:D.business,kind:'entity'}]:[];}
function homeLenses(){return D.lenses||[];}
function inEntity(){var m={};entityLenses().forEach(function(l){l.inside.forEach(function(id){m[id]=1;});});return m;}
function lensNames(){return [D.defaultLens,HOME].concat(homeLenses().map(function(l){return l.name;})).concat(entityLenses().map(function(l){return l.name;}));}
function lensInside(name){if(name===D.defaultLens)return D.inside;
  if(name===HOME){var e=inEntity();return D.inside.filter(function(n){return !e[n];});}
  var l=(D.lenses||[]).filter(function(x){return x.name===name;})[0];return l?l.inside:D.inside;}
// 순자산·잔액표는 고른 그룹의 계좌만 더한다. 기본 렌즈는 관측된 계좌 전부 — 새 계좌가 관측되기 시작하면 거기서만 합계가 뛴다.
function inLens(a){return LENS===D.defaultLens||INS[a.id];}
function sheet(t){return D.accounts.filter(inLens).map(function(a){return {id:a.id,app:a.app,v:valueAt(a.id,t)};});}
function total(t){var s=0,unk=0;sheet(t).forEach(function(r){if(r.v)s+=r.v[1];else unk++;});return {sum:s,unk:unk};}
var INS={};
function flows(t1,t2){var inc=0,out=0,xf=0,cap={},rows=[];
  D.lines.forEach(function(l){var t=P(l.ts);if(t<t1||t>=t2)return;var d=!!INS[l.dr],c=!!INS[l.cr],k='';
    if(d&&c){xf+=l.amount;k='xf';}else if(c){out+=l.amount;cap[l.dr]=(cap[l.dr]||0)+l.amount;k='out';}
    else if(d&&l.rev){out-=l.amount;cap[l.cr]=(cap[l.cr]||0)-l.amount;k='out';}else if(d){inc+=l.amount;k='inc';}
    rows.push({l:l,k:k});});
  return {inc:inc,out:out,xf:xf,cap:cap,rows:rows};}
// observed change of the assets between two instants: only accounts observed at both ends count
function observed(a,b){var s=0,n=0;D.accounts.filter(inLens).forEach(function(acc){var v1=valueAt(acc.id,a),v2=valueAt(acc.id,b);if(v1&&v2){s+=v2[1]-v1[1];n++;}});return {sum:s,n:n};}
// ---- 재무 상태 트리맵: 자산 + 비용 = 부채 + 자본 + 수익. 면적 = 금액. 누르면 그 칸이 맵 전부가 되어 자식(계정과목 → 계좌)이 다시 꽉 찬 트리맵으로.
var KIND={asset:'자산',expense:'비용',liability:'부채',equity:'자본',income:'수익'},PATH=[];
function val(n){return n.children?n.children.reduce(function(s,c){return s+val(c);},0):(n.value||0);}
function eqTree(){var now=new Date(),own={},biz={};D.inside.forEach(function(n){own[n]=1;});D.accounts.forEach(function(a){own[a.id]=1;});(D.business||[]).forEach(function(id){biz[id]=1;});
  // 사업 구분은 계좌에 고정된 사실(기업뱅킹에서 읽은 계좌 = 사업자). 비용·수익 줄은 반대편 내 계좌의 구분을 따라 가계부/사업자 갈래로 간다.
  // 내 계좌끼리는 이체라 비용도 수익도 아니다. 가계↔사업 이체는 한쪽의 출자, 다른 쪽의 인출인데 따로 적지 않는다: 구분마다 자본을 잔여로 두면 그 값이 곧 출자·인출이고, 전부에서는 상쇄된다.
  var seg=function(id){return biz[id]?BIZ:HOME;};
  var all=D.accounts.map(function(a){var v=valueAt(a.id,now);return {name:a.id,meta:a.app,value:v?v[1]:0,unseen:!v,kind:'asset'};});
  // 음수 잔액(마이너스 통장·대출 잔액)은 자산이 아니라 부채: 은행에 갚을 돈. 양수·못 본 계좌만 자산에 남는다.
  var accts=all.filter(function(a){return a.value>=0;}),debts=all.filter(function(a){return a.value<0;}).map(function(a){return {name:a.name,meta:a.app,value:-a.value,kind:'liability'};});
  var inv={};(D.invest||[]).forEach(function(id){inv[id]=1;});   // 증권 앱의 잔액은 예금이 아니라 투자(평가금액)
  var home=accts.filter(function(a){return !biz[a.name];}),bizA=accts.filter(function(a){return biz[a.name];}),split=!!(D.business||[]).length;
  var group=function(name,xs){var h=xs.filter(function(a){return !biz[a.name];}),b=xs.filter(function(a){return biz[a.name];});return {name:name,kind:'asset',children:split?[{name:HOME,kind:'asset',children:h},{name:BIZ,kind:'asset',children:b}].filter(function(g){return g.children.length;}):h};};   // 빈 구분은 안 그린다
  var deposits=group('예금',accts.filter(function(a){return !inv[a.name];})),invest=accts.some(function(a){return inv[a.name];})?group('투자',accts.filter(function(a){return inv[a.name];})):null;
  var exp={},inc={};   // 구분 › 라벨 › 금액. 밖으로 나간 돈은 비용(차변 라벨), 밖에서 들어온 돈은 수익(대변 라벨)
  function add(m,s,k,v){m[s]=m[s]||{};m[s][k]=(m[s][k]||0)+v;}
  D.lines.forEach(function(l){var d=!!own[l.dr],c=!!own[l.cr];if(d&&c||!d&&!c)return;
    if(c&&!d)add(exp,seg(l.cr),l.dr,l.amount);else if(l.rev)add(exp,seg(l.dr),l.cr,-l.amount);else add(inc,seg(l.dr),l.cr,l.amount);});
  function leaves(m,kind){return Object.keys(m||{}).map(function(k){return {name:k,kind:kind,value:m[k]};}).filter(function(x){return x.value>0;});}
  function bySeg(m,kind){if(!split)return leaves(m[HOME],kind);   // 사업자 계좌가 없으면 갈래 없이 잎만
    return [HOME,BIZ].filter(function(s){return m[s];}).map(function(s){return {name:s,kind:kind,children:leaves(m[s],kind)};});}
  var expenses=bySeg(exp,'expense'),incomes=bySeg(inc,'income');
  var sum=function(xs){return xs.reduce(function(s,x){return s+val(x);},0);},owed=function(s){return debts.filter(function(d){return seg(d.name)===s;});},L=sum(debts);
  var borrow=split?[HOME,BIZ].filter(function(s){return owed(s).length;}).map(function(s){return {name:s,kind:'liability',children:owed(s)};}):debts;
  var liability=debts.length?{name:KIND.liability,kind:'liability',children:[{name:'차입',kind:'liability',children:borrow}]}:{name:KIND.liability,kind:'liability',value:0,note:'본 적 없음'};
  var residual=function(s){return sum(s===BIZ?bizA:home)+sum(leaves(exp[s],'expense'))-sum(leaves(inc[s],'income'))-sum(owed(s));};   // 구분의 자본 = 그 구분의 자산 + 비용 − 수익 − 부채
  var parts=(split?[HOME,BIZ]:[HOME]).map(function(s){return {name:s,kind:'equity',value:residual(s)};});
  // 자본이 음수인 구분(부채 > 자산 + 비용 − 수익)은 대변에 그릴 면적이 없다. 그 몫은 차변에 '자본잠식'으로 둔다: 자산 + 비용 + 자본잠식 = 부채 + 자본 + 수익.
  var plus=parts.filter(function(p){return p.value>=0;}),minus=parts.filter(function(p){return p.value<0;}).map(function(p){return {name:p.name,kind:'equity',value:-p.value};}),eqNote=plus.length?'자산 + 비용 − 수익 − 부채':'자본잠식';
  var equity=split?{name:KIND.equity,kind:'equity',note:eqNote,children:plus}:{name:KIND.equity,kind:'equity',value:Math.max(0,parts[0].value),note:eqNote};
  var deficit=!minus.length?null:split?{name:'자본잠식',kind:'equity',note:'부채가 자산보다 큼',children:minus}:{name:'자본잠식',kind:'equity',note:'부채가 자산보다 큼',value:minus[0].value};
  var debit=[{name:KIND.asset,kind:'asset',children:invest?[deposits,invest]:[deposits]},{name:KIND.expense,kind:'expense',children:expenses,unseen:!D.lines.length,note:D.lines.length?null:'내역 없음'}];if(deficit)debit.push(deficit);
  return {name:'전부',children:[
    {name:'차변',children:debit},
    {name:'대변',children:[liability,equity,{name:KIND.income,kind:'income',children:incomes,unseen:!D.lines.length,note:D.lines.length?null:'내역 없음'}]}]};}
function squarify(items,x,y,w,h){var out=[],total=0;items.forEach(function(i){total+=i.v;});if(!total||w<=0||h<=0)return out;
  var k=w*h/total,rest=items.map(function(i){return {item:i,a:i.v*k};}),row=[],rx=x,ry=y,rw=w,rh=h;
  function worst(r,len){var s=0,mx=0,mn=Infinity;r.forEach(function(e){s+=e.a;mx=Math.max(mx,e.a);mn=Math.min(mn,e.a);});return Math.max(len*len*mx/(s*s),s*s/(len*len*mn));}
  function lay(r){var s=0;r.forEach(function(e){s+=e.a;});
    if(rw>=rh){var cw=s/rh,cy=ry;r.forEach(function(e){var ch=e.a/cw;out.push({item:e.item,x:rx,y:cy,w:cw,h:ch});cy+=ch;});rx+=cw;rw-=cw;}
    else{var ch2=s/rw,cx=rx;r.forEach(function(e){var cw2=e.a/ch2;out.push({item:e.item,x:cx,y:ry,w:cw2,h:ch2});cx+=cw2;});ry+=ch2;rh-=ch2;}}
  rest.forEach(function(e){var len=Math.min(rw,rh);if(row.length&&worst(row.concat([e]),len)>worst(row,len)){lay(row);row=[e];}else row.push(e);});
  if(row.length)lay(row);return out;}
function nodeAt(path){var n=TREE;path.forEach(function(name){n=(n.children||[]).filter(function(c){return c.name===name;})[0]||n;});return n;}
function drawMap(){var map=document.getElementById('map'),list=document.getElementById('list');if(!map||!TREE)return;var rem=parseFloat(getComputedStyle(document.documentElement).fontSize)/16;
  var tb=document.getElementById('mapToggle');if(tb){tb.classList.toggle('on',VIEW==='map');tb.setAttribute('aria-pressed',String(VIEW==='map'));}
  map.hidden=VIEW!=='map';if(list)list.hidden=VIEW==='map';if(VIEW!=='map'){drawList();drawCrumbs();return;}
  var node=nodeAt(PATH),kids=(node.children||[]).map(function(c){return {n:c,v:Math.max(0,val(c))};}),shown=kids.filter(function(k){return k.v>0;}),skipped=kids.filter(function(k){return k.v<=0;});
  var cw=map.clientWidth||800,ch=Math.max(320*rem,Math.min(cw*0.6,640*rem));map.style.height=ch+'px';
  var rects=[],labels='';

var DAYS=[];

function drawTile(fig,s,w,h){var sv=fig.querySelector('svg'),cap=fig.querySelector('figcaption');

// ---- bottom: per day, observed change vs explained change (income − spend); the difference is what the ledger did not see
function drawEq(){if(!document.getElementById('eq'))return;rem=parseFloat(getComputedStyle(document.documentElement).fontSize)/16;var ab=RANGES[range](),a=ab[0],b=ab[1],days=[];

// ---- a day: summary, account balances, and transaction evidence links.
function balanceTable(start, end) {
  var rows = start.map(function(account, i) {              // sheet() rows: 고른 그룹의 계좌만(id·app·v), start/end 같은 순서
    var before = account.v, after = end[i].v;
    var missing = '<span class="mute">—</span>';
    return '<tr><td>' + esc(account.id) + ' <span class="meta">' + esc(account.app) + '</span></td>' +
      '<td class="n">' + (before ? won(before[1]) : missing) + '</td>' +
      '<td class="n">' + (after ? won(after[1]) : missing) + '</td>' +
      '<td class="n">' + (before && after ? signed(after[1] - before[1]) : missing) + '</td>' +
      '<td class="meta">' + (after ? esc(after[2]) + ' · ' + esc(after[0]) : '관측 없음') + '</td></tr>';
  }).join('');
  return '<table aria-label="선택일 계좌 잔액"><thead><tr>' +
    '<th scope="col">계좌</th><th scope="col" class="n">00:00</th><th scope="col" class="n">24:00</th>' +
    '<th scope="col" class="n">증감</th><th scope="col">근거</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function transactionTable(flow) {
  if (!flow.rows.length) return '';
  var categories = Object.keys(flow.cap).sort(function(a, b) { return flow.cap[b] - flow.cap[a]; });
  var destinations = categories.map(function(key) { return esc(key) + ' ' + won(flow.cap[key]); }).join(', ');
  var header = '<div class="sec"><h3 id="transactions-title">거래 ' + flow.rows.length + '건</h3>' +
    (destinations ? '<span class="r"><span>어디로: ' + destinations + '</span></span>' : '') + '</div>';
  var rows = flow.rows.map(function(entry) {
    var line = entry.l;
    var memo = line.uid ? '<button class="transaction" type="button" aria-label="' + esc(line.memo + ' 증빙 보기') +
      '">' + esc(line.memo) + '</button>' : esc(line.memo);
    var kind = {inc: '수입', out: '지출', xf: '이체', '': '무관'}[entry.k];
    return '<tr class="' + entry.k + '"' + (line.uid ? ' data-uid="' + esc(line.uid) + '"' : '') + '>' +
      '<td>' + esc(line.ts.slice(11)) + '</td><td>' + memo + '</td>' +
      '<td>' + esc(line.cr) + ' → ' + esc(line.dr) + '</td>' +
      '<td class="n">' + won(line.amount) + '</td><td class="meta">' + kind + '</td></tr>';
  }).join('');
  return header + '<table aria-labelledby="transactions-title"><tbody>' + rows + '</tbody></table>';
}

function daySummary(day, start, end, flow, observation) {
  var unexplained = observation.sum - (flow.inc - flow.out);
  return '<header class="sec"><h2 id="day-title">' + fmtFull(day) +
    '</h2><span class="r">00:00 → 24:00 KST</span></header>' +
    '<div><span class="key">' + won(end.sum).replace('원', '') + '</span> <span class="meta">원 · 끝</span></div>' +
    '<div class="grid3"><div><span class="lbl">시작 순자산</span><span class="n">' + won(start.sum) + '</span></div>' +
    '<div><span class="lbl">관측 증감</span><span class="n">' + signed(observation.sum) + '</span></div>' +
    '<div><span class="lbl">수입 − 지출</span><span class="n">' + signed(flow.inc - flow.out) + '</span></div>' +
    '<div><span class="lbl">미관측</span><span class="n' + (unexplained ? ' strong' : '') + '">' +
    signed(unexplained) + '</span></div></div>';

function showDay(day) {

    balanceTable(sheet(day), sheet(end)) + transactionTable(flow);
