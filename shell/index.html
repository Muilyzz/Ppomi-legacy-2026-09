<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>뽀미</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 14px/1.45 system-ui, sans-serif;
        color: #111;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f4f4f5; background: #111; }
      }
      main {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 40rem;
        margin: 0 auto;
      }
      #log {
        flex: 1;
        overflow: auto;
        padding: 1rem 1rem 0.5rem;
      }
      #log p {
        margin: 0 0 0.75rem;
        max-width: 85%;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log p[data-role="user"] { margin-left: auto; }
      #composer {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem 1rem 1rem;
      }
      #composer input {
        flex: 1;
        font: inherit;
        padding: 0.5rem 0.6rem;
      }
      #composer button {
        font: inherit;
        font-weight: 500;
        background: #3b82f6;
        color: #fff;
        border: 0;
        padding: 0.5rem 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="log" role="log" aria-label="현재 대화"></div>
      <form id="composer">
        <input id="intent" type="text" name="intent" placeholder="할 일" aria-label="할 일" autocomplete="off" />
        <button type="submit">보내기</button>
      </form>
    </main>
    <script type="module" src="./ui.js"></script>
  </body>
</html>
