name: windows-executor

on:
  workflow_dispatch:
  push:
    paths:
      - "executors/windows/**"
      - "scripts/build-windows-executor.mjs"
      - ".github/workflows/windows-executor.yml"
  pull_request:
    paths:
      - "executors/windows/**"
      - "scripts/build-windows-executor.mjs"
      - ".github/workflows/windows-executor.yml"

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project executors/windows/PolicyTests/Ppomi.Executor.PolicyTests.csproj

  publish:
    needs: policy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: node scripts/build-windows-executor.mjs --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: ppomi-executor-${{ matrix.rid }}
          path: shell/src-tauri/resources/executor/ppomi-executor.exe
          if-no-files-found: error
