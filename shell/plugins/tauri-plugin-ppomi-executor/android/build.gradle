plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// One source tree: the standalone Android host and the Tauri library compile the same executor.
def ppomiAndroid = file('../../../../Android')
android {
    namespace 'com.ppomi.androidbridge'
    compileSdk 35
    defaultConfig {
        minSdk 28
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            java.srcDirs += [new File(ppomiAndroid, 'app/src/main/java')]
            res.srcDirs += [new File(ppomiAndroid, 'app/src/main/res')]
            assets.srcDirs += [new File(ppomiAndroid, 'app/src/main/assets'), new File(ppomiAndroid, 'swift-core/build/assets')]
            jniLibs.srcDirs += [new File(ppomiAndroid, 'swift-core/build/jniLibs')]
        }
        debug {
            java.srcDirs += [new File(ppomiAndroid, 'app/src/debug/java')]
        }
    }
    buildFeatures { buildConfig true; compose true }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':tauri-android')
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
tasks.register('buildSharedAccounting', Exec) {
    commandLine 'bash', new File(ppomiAndroid, 'swift-core/build.sh').absolutePath, 'android'
}
tasks.named('preBuild').configure { dependsOn tasks.named('buildSharedAccounting') }
