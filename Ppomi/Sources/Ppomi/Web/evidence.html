<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><title>증빙·전표</title>
<style>/*THEME*/
/* the column and the peeked screenshot stay paper (#fff, radius 0) in both schemes: the words' colours are sampled from the
   phone's (light) pixels and the column is a reproduction of that paper, not our UI. One app at a time (.nav picks). */
.evidence{display:none} .evidence.on{display:block}
#cols{margin-top:.5rem}
#hd{margin-top:2rem}
.col{position:relative;width:348px;background:#fff;border:0}
.row{position:absolute;left:0;width:348px;color:#222} .row span{position:absolute;white-space:nowrap;line-height:1;font-size:15px;font-family:var(--font)}
.peek{position:absolute;left:0;width:348px;height:766px;opacity:0;z-index:5;pointer-events:none} .peek.on{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,40%{opacity:1} 50%,90%{opacity:0} 100%{opacity:1}}   /* the pulse: pixels, then the reading, then pixels again */
.peek img{display:block;width:348px;height:766px;border:1px solid #ddd;box-sizing:border-box;background:#fff}
.box{position:absolute;left:4px;width:338px;border:1px solid;border-radius:0;box-sizing:border-box;background:none}
.box.warn{border-style:dashed;border-color:color-mix(in srgb,var(--primary) 24%,white)} .box.bad{border-color:color-mix(in srgb,var(--accent) 75%,black);background:color-mix(in srgb,var(--accent) 14%,white)}   /* 종이 위라 라이트 값 고정 */
.row.hit{outline:2px solid var(--primary);outline-offset:2px}
.back{border:0;background:none;padding:0;color:var(--fg);font:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;cursor:pointer}
.back:focus-visible,.nav button:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<main aria-label="증빙·전표">
<nav class="nav" id="apps" aria-label="증빙 앱"></nav>
<section aria-label="선택한 앱의 증빙">
<header class="sec" id="hd"></header>
<div class="meta" id="crumb"></div>
<div id="cols"></div>
</section>
<details><summary>읽는 법</summary>
<p>글자 = OCR 원문(위치·색·크기는 원본 픽셀) · 점선 = 전표 없음 · 실선 = 금액 행 파싱 안 됨 · 열 위에 마우스 = 원본 깜빡임 대조</p>
</details>
</main>
<script>
// The data: Swift (Evidence.html) replaces the placeholder with {sub, apps:[{title, account, frames, placed, ok, bad, col}]},
// col being the column markup Column.build made (rows at the screenshots' positions, boxes, one hidden <img> per frame).
var E=/*EVIDENCE*/null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c];});}
function post(m){if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.ppomi)webkit.messageHandlers.ppomi.postMessage(m);}
var apps=document.getElementById('apps'),cols=document.getElementById('cols'),hd=document.getElementById('hd'),crumb=document.getElementById('crumb');
E.apps.forEach(function(a,i){
  var t=document.createElement('button');t.type='button';t.textContent=a.title;t.onclick=function(){show(i);};apps.appendChild(t);
  var d=document.createElement('div');d.className='evidence';d.innerHTML=a.col;cols.appendChild(d);});
// show(i): one app's column at a time; the section label carries its counts and the two box meanings.
function show(i){
  [apps,cols].forEach(function(p){Array.prototype.forEach.call(p.children,function(c,k){c.classList.toggle('on',k===i);});});
  Array.prototype.forEach.call(apps.children,function(t,k){t.setAttribute('aria-pressed',String(k===i));});
  var a=E.apps[i];if(!a)return;
  hd.innerHTML='<h2>'+esc(a.title+' · '+a.account)+'</h2><span class="r">'+a.frames+'장 · 전표 '+a.ok+' · 이상 '+a.bad+'<span><i style="border:1px dashed color-mix(in srgb,var(--primary) 24%,white)"></i>전표 없음 <i style="border:1px solid color-mix(in srgb,var(--accent) 75%,black)"></i>파싱 안 됨</span></span>';
}
crumb.textContent=E.sub;
if(E.apps.length)show(0);else cols.innerHTML='<p>프레임 없음</p>';
// focus(id): the journal's row, outlined and scrolled to the middle, its app shown, its text in the crumb with a way back; null clears.
function focus(id){
  document.querySelectorAll('.row.hit').forEach(function(r){r.classList.remove('hit');});
  var r=id&&document.getElementById(id);
  if(!r){crumb.textContent=E.sub;return;}
  r.classList.add('hit');
  show(Array.prototype.indexOf.call(cols.children,r.closest('.evidence')));
  crumb.innerHTML=esc(r.textContent.trim().replace(/\s+/g,' '))+' · <button class="back" type="button" id="back">← 타임라인</button>';
  document.getElementById('back').onclick=function(){post({timeline:1});};
  r.scrollIntoView({block:'center'});
}
</script>
<script>
// typography from the source, not from rules: for every word, the ink colour is the mean of the darkest 15% of pixels in its
// OCR box on the frame it was read from, and the font size starts at the box height and is scaled so the rendered width
// equals the box width (width spans many glyphs, so it is far steadier than height). Weight is left alone.
window.addEventListener('load',function(){
  var canv=document.createElement('canvas'),ctx=canv.getContext('2d',{willReadFrequently:true}),cache={};
  function pixels(id){if(cache[id])return cache[id];var im=document.getElementById(id);canv.width=im.naturalWidth;canv.height=im.naturalHeight;ctx.drawImage(im,0,0);return cache[id]=ctx.getImageData(0,0,canv.width,canv.height);}
  document.querySelectorAll('.evidence').forEach(function(ev){   // width fitting needs layout: a hidden column is shown while measured
    var was=ev.classList.contains('on');ev.classList.add('on');
    ev.querySelectorAll('.row').forEach(function(r){
      var d=pixels(r.dataset.src),W=d.width,H=d.height;
      r.querySelectorAll('span').forEach(function(sp){
        var b=sp.dataset.b.split(',').map(Number),x0=Math.round(b[0]*W),y0=Math.round(b[1]*H),x1=Math.round((b[0]+b[2])*W),y1=Math.round((b[1]+b[3])*H),px=[];
        for(var y=y0;y<y1;y++)for(var x=x0;x<x1;x++){var i=(y*W+x)*4;px.push(d.data[i]+d.data[i+1]+d.data[i+2]);}
        px.sort(function(a,b){return a-b});var n=Math.max(1,Math.floor(px.length*0.15)),c=[0,0,0],m=0;
        for(var y=y0;y<y1&&m<n;y++)for(var x=x0;x<x1&&m<n;x++){var i=(y*W+x)*4;if(d.data[i]+d.data[i+1]+d.data[i+2]<=px[n-1]){c[0]+=d.data[i];c[1]+=d.data[i+1];c[2]+=d.data[i+2];m++;}}
        sp.style.color='rgb('+Math.round(c[0]/m)+','+Math.round(c[1]/m)+','+Math.round(c[2]/m)+')';
        var h=b[3]*766,w=b[2]*348;sp.style.fontSize=h+'px';var mw=sp.getBoundingClientRect().width;if(mw>0)sp.style.fontSize=(h*w/mw).toFixed(1)+'px';
      });
    });
    if(!was)ev.classList.remove('on');
  });
});
// blink comparator: while the pointer is anywhere over a column, one whole original screenshot (never a crop) pulses in and
// out over the text at its registered place — the frame in which the pointer's height sits nearest mid-screen. The target is
// the column, not the rows, so crossing the blank between rows changes nothing; the frame switches only where the best
// frame changes, and the pulse keeps its rhythm across switches.
document.querySelectorAll('.col').forEach(function(col){
  var fr=JSON.parse(col.dataset.frames),peek=col.querySelector('.peek'),img=peek.querySelector('img'),cur=-1;
  col.addEventListener('mousemove',function(ev){
    var y=(ev.clientY-col.getBoundingClientRect().top)/766,best=-1,bd=9;
    for(var i=0;i<fr.length;i++){var l=y-fr[i][0];if(l>=fr[i][1]&&l<fr[i][2]&&Math.abs(l-0.5)<bd){bd=Math.abs(l-0.5);best=i;}}
    if(best<0){peek.classList.remove('on');cur=-1;return;}
    if(best!==cur){cur=best;img.src=document.getElementById('im-'+col.dataset.app+'-'+best).src;peek.style.top=(fr[best][0]*766)+'px';}
    peek.classList.add('on');
  });
  col.addEventListener('mouseleave',function(){peek.classList.remove('on');cur=-1;});
});
</script>
</body>
</html>
