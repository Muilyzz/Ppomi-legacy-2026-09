[package]
name = "ppomi-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ppomi_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
