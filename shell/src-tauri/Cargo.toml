[package]
name = "ppomi-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ppomi_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tauri-plugin-dialog = "2.7.2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-ppomi-executor = { path = "../plugins/tauri-plugin-ppomi-executor" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKUIDelegate", "WKWebView", "WKFrameInfo", "WKSecurityOrigin", "block2", "objc2-app-kit", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
